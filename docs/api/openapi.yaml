openapi: 3.1.0
info:
  title: ANNEX API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      description: Liveness probe — 200 whenever the process is serving requests.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /health/ready:
    get:
      tags:
      - system
      summary: Readiness
      description: 'Readiness probe — reports each configured dependency''s status.


        Returns 200 when every registered check passes and 503 (degraded) as

        soon as one fails, with per-check detail for operators.'
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/meta/version:
    get:
      tags:
      - system
      summary: Version
      description: Return the API name, version, and runtime environment.
      operationId: version_api_v1_meta_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Version Api V1 Meta Version Get
  /api/v1/users/me:
    get:
      tags:
      - users
      summary: Me
      description: 'Return the authenticated caller''s profile.


        Requires ``Authorization: Bearer <Firebase ID token>``. The user is

        hydrated into the database on first access (ADR-0005).'
      operationId: me_api_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Me Api V1 Users Me Get
  /api/v1/analysis:
    post:
      tags:
      - analysis
      summary: Submit
      description: 'Submit text, a URL, or an image for claim analysis.


        Accepts anonymous submissions; anonymous analyses carry no owner and can

        only be read back by their holder while unauthenticated context exists.

        Returns 202 with the analysis so clients can poll for the report.'
      operationId: submit_api_v1_analysis_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnalysisRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Submit Api V1 Analysis Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - analysis
      summary: List Analyses
      description: List the caller's analyses, newest first (cursor-paginated).
      operationId: list_analyses_api_v1_analysis_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Analyses Api V1 Analysis Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/analysis/{analysis_id}:
    get:
      tags:
      - analysis
      summary: Get Analysis
      description: Fetch one analysis with its report (owner only).
      operationId: get_analysis_api_v1_analysis__analysis_id__get
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Analysis Api V1 Analysis  Analysis Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - analysis
      summary: Delete Analysis
      description: Delete an analysis (owner only).
      operationId: delete_analysis_api_v1_analysis__analysis_id__delete
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Analysis Api V1 Analysis  Analysis Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/claims/{claim_id}:
    get:
      tags:
      - claims
      summary: Get Claim
      description: Fetch one claim with its verdict and rationale (owner only).
      operationId: get_claim_api_v1_claims__claim_id__get
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Claim Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Claim Api V1 Claims  Claim Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/claims/{claim_id}/evidence:
    get:
      tags:
      - claims
      summary: Get Claim Evidence
      description: Fetch the evidence links supporting a claim's verdict (owner only).
      operationId: get_claim_evidence_api_v1_claims__claim_id__evidence_get
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Claim Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Claim Evidence Api V1 Claims  Claim Id  Evidence
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sources/search:
    get:
      tags:
      - sources
      summary: Search Sources
      description: Search sources by domain or name (case-insensitive substring).
      operationId: search_sources_api_v1_sources_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 100
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Search Sources Api V1 Sources Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sources/{domain}:
    get:
      tags:
      - sources
      summary: Get Source
      description: 'Fetch one source profile with its credibility score.


        Public read: the profile carries the community aggregate; when the

        caller supplies a token, it also includes their own rating.'
      operationId: get_source_api_v1_sources__domain__get
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          title: Domain
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Source Api V1 Sources  Domain  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sources/{domain}/rate:
    post:
      tags:
      - sources
      summary: Rate Source
      description: 'Rate a source''s credibility (1–5), updating the community signal.


        Re-rating replaces the caller''s own rating (one voice per user); the

        response carries the updated profile with the aggregated community

        count and average.'
      operationId: rate_source_api_v1_sources__domain__rate_post
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          title: Domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateSourceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Rate Source Api V1 Sources  Domain  Rate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/media:
    post:
      tags:
      - media
      summary: Submit Media
      description: Ingest an image for an owned analysis; returns the media record.
      operationId: submit_media_api_v1_media_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMediaRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Submit Media Api V1 Media Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/media/{media_id}:
    get:
      tags:
      - media
      summary: Get Media
      description: Fetch one media record with OCR + forensics (owner only).
      operationId: get_media_api_v1_media__media_id__get
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Media Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Media Api V1 Media  Media Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/lessons:
    get:
      tags:
      - lessons
      summary: List Lessons
      description: 'Return the published curriculum, localized for the caller.


        The optional ``locale`` query parameter overrides the caller''s

        profile locale so clients can preview content in another language

        (the resolved content falls back through the locale chain, ADR-0007).'
      operationId: list_lessons_api_v1_lessons_get
      parameters:
      - name: locale
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 35
          - type: 'null'
          description: 'Content locale override (default: profile locale).'
          title: Locale
        description: 'Content locale override (default: profile locale).'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Lessons Api V1 Lessons Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/lessons/{lesson_ref}:
    get:
      tags:
      - lessons
      summary: Get Lesson
      description: 'Fetch one lesson with its localized content and progress.


        ``lesson_ref`` accepts either the lesson UUID or its stable slug

        (e.g. ``spotting-misinformation``), so clients can deep-link with

        human-readable URLs. The optional ``locale`` query parameter

        overrides the caller''s profile locale.'
      operationId: get_lesson_api_v1_lessons__lesson_ref__get
      parameters:
      - name: lesson_ref
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9a-f-]{36}|[a-z0-9-]{1,100}'
          title: Lesson Ref
      - name: locale
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 35
          - type: 'null'
          description: 'Content locale override (default: profile locale).'
          title: Locale
        description: 'Content locale override (default: profile locale).'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Lesson Api V1 Lessons  Lesson Ref  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/lessons/{lesson_ref}/complete:
    post:
      tags:
      - lessons
      summary: Complete Lesson
      description: Mark a lesson complete (idempotent; first completion wins).
      operationId: complete_lesson_api_v1_lessons__lesson_ref__complete_post
      parameters:
      - name: lesson_ref
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9a-f-]{36}|[a-z0-9-]{1,100}'
          title: Lesson Ref
      - name: locale
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 35
          - type: 'null'
          description: 'Content locale override (default: profile locale).'
          title: Locale
        description: 'Content locale override (default: profile locale).'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Complete Lesson Api V1 Lessons  Lesson Ref  Complete
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes:
    get:
      tags:
      - classes
      summary: List Classes
      description: List the caller's classes (owned or joined) with their role.
      operationId: list_classes_api_v1_classes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Classes Api V1 Classes Get
    post:
      tags:
      - classes
      summary: Create Class
      description: Create a class; the caller becomes its teacher.
      operationId: create_class_api_v1_classes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Class Api V1 Classes Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}:
    get:
      tags:
      - classes
      summary: Get Class
      description: Fetch one class with its member roster (members only).
      operationId: get_class_api_v1_classes__class_id__get
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Class Api V1 Classes  Class Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - classes
      summary: Delete Class
      description: Delete a class and its members/assignments (owner only).
      operationId: delete_class_api_v1_classes__class_id__delete
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Class Api V1 Classes  Class Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/join:
    post:
      tags:
      - classes
      summary: Join Class
      description: 'Join a class by its invite code (idempotent).


        The class is resolved from the invite code in the body — the URL id

        is not trusted for joining, so a stale or wrong link cannot

        misdirect a join.'
      operationId: join_class_api_v1_classes__class_id__join_post
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinClassRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Join Class Api V1 Classes  Class Id  Join Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/assignments:
    post:
      tags:
      - classes
      summary: Assign Lesson
      description: Assign a published lesson to a class (teacher only, idempotent).
      operationId: assign_lesson_api_v1_classes__class_id__assignments_post
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignLessonRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Assign Lesson Api V1 Classes  Class Id  Assignments
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - classes
      summary: List Assignments
      description: List a class's assignments with completion stats (members only).
      operationId: list_assignments_api_v1_classes__class_id__assignments_get
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Assignments Api V1 Classes  Class Id  Assignments
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/progress:
    get:
      tags:
      - classes
      summary: Class Progress
      description: Per-assignment, per-student completion for a class (teacher only).
      operationId: class_progress_api_v1_classes__class_id__progress_get
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Class Progress Api V1 Classes  Class Id  Progress
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/assignments/{assignment_id}/progress:
    get:
      tags:
      - classes
      summary: Assignment Progress
      description: Per-student completion for one assignment (teacher only).
      operationId: assignment_progress_api_v1_classes__class_id__assignments__assignment_id__progress_get
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Assignment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Assignment Progress Api V1 Classes  Class Id  Assignments  Assignment
                  Id  Progress Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/assignments/{assignment_id}:
    delete:
      tags:
      - classes
      summary: Unassign Lesson
      description: Remove an assignment (teacher only).
      operationId: unassign_lesson_api_v1_classes__class_id__assignments__assignment_id__delete
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Assignment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Unassign Lesson Api V1 Classes  Class Id  Assignments  Assignment
                  Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/members/{member_id}:
    delete:
      tags:
      - classes
      summary: Remove Member
      description: Remove a student from a class (teacher only).
      operationId: remove_member_api_v1_classes__class_id__members__member_id__delete
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
      - name: member_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Member Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Remove Member Api V1 Classes  Class Id  Members  Member
                  Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/i18n/locales:
    get:
      tags:
      - i18n
      summary: List Locales
      description: Return every enabled locale with its fallback parent.
      operationId: list_locales_api_v1_i18n_locales_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Locales Api V1 I18N Locales Get
  /api/v1/i18n/bundles/{locale}:
    get:
      tags:
      - i18n
      summary: Get Bundle
      description: 'Return a versioned translation bundle resolved over the fallback
        chain.


        Conditional requests: pass the previously received ``version`` as a

        query parameter (or ``If-None-Match`` with the bundle ETag) to receive

        ``304 Not Modified`` while the bundle is unchanged.'
      operationId: get_bundle_api_v1_i18n_bundles__locale__get
      parameters:
      - name: locale
        in: path
        required: true
        schema:
          type: string
          title: Locale
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/i18n/suggestions/missing:
    get:
      tags:
      - i18n
      summary: List Missing
      description: 'List keys the default locale defines that ``locale`` lacks.


        Public, like the bundle endpoints. The contributor uses this to pick

        what to translate; approved suggestions stop being missing naturally.'
      operationId: list_missing_api_v1_i18n_suggestions_missing_get
      parameters:
      - name: locale
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 16
          title: Locale
      - name: default_locale
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 16
          default: en
          title: Default Locale
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Missing Api V1 I18N Suggestions Missing Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/i18n/suggestions:
    post:
      tags:
      - i18n
      summary: Submit Suggestion
      description: Submit a translation proposal for an enabled locale.
      operationId: submit_suggestion_api_v1_i18n_suggestions_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSuggestionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Submit Suggestion Api V1 I18N Suggestions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - i18n
      summary: List Own Suggestions
      description: List the caller's suggestions, newest first (optional status filter).
      operationId: list_own_suggestions_api_v1_i18n_suggestions_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(pending|approved|rejected)$
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Own Suggestions Api V1 I18N Suggestions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/i18n/suggestions/pending:
    get:
      tags:
      - i18n
      summary: List Pending
      description: List the moderator review queue, oldest first.
