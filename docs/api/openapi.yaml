      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Pending Api V1 I18N Suggestions Pending Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/i18n/suggestions/{suggestion_id}/review:
    post:
      tags:
      - i18n
      summary: Review Suggestion
      description: 'Approve or reject a pending suggestion (moderator+).


        Approving publishes the value into ``i18n_translations`` with a

        version bump, so clients refresh without a release.'
      operationId: review_suggestion_api_v1_i18n_suggestions__suggestion_id__review_post
      parameters:
      - name: suggestion_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Suggestion Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSuggestionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Review Suggestion Api V1 I18N Suggestions  Suggestion
                  Id  Review Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnalysisInputType:
      type: string
      enum:
      - text
      - url
      - image
      title: AnalysisInputType
      description: The kind of content submitted for analysis.
    AssignLessonRequest:
      properties:
        lesson_ref:
          type: string
          maxLength: 120
          minLength: 1
          title: Lesson Ref
        due_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Due At
      type: object
      required:
      - lesson_ref
      title: AssignLessonRequest
      description: 'Body for ``POST /classes/{id}/assignments``.


        ``lesson_ref`` accepts either a lesson UUID or its stable slug.'
    CreateClassRequest:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
      type: object
      required:
      - name
      title: CreateClassRequest
      description: Body for ``POST /classes``.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JoinClassRequest:
      properties:
        invite_code:
          type: string
          maxLength: 8
          minLength: 8
          pattern: ^[A-Za-z0-9]{8}$
          title: Invite Code
      type: object
      required:
      - invite_code
      title: JoinClassRequest
      description: Body for ``POST /classes/{id}/join``.
    RateSourceRequest:
      properties:
        rating:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Rating
      type: object
      required:
      - rating
      title: RateSourceRequest
      description: Body for ``POST /sources/{domain}/rate``.
    ReviewSuggestionRequest:
      properties:
        approved:
          type: boolean
          title: Approved
      type: object
      required:
      - approved
      title: ReviewSuggestionRequest
      description: Body for ``POST /i18n/suggestions/{id}/review``.
    SubmitAnalysisRequest:
      properties:
        input_type:
          $ref: '#/components/schemas/AnalysisInputType'
          default: text
        text:
          anyOf:
          - type: string
            maxLength: 20000
            minLength: 1
          - type: 'null'
          title: Text
        url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Url
        image:
          anyOf:
          - type: string
          - type: 'null'
          title: Image
        locale:
          type: string
          maxLength: 10
          minLength: 2
          title: Locale
          default: en
      type: object
      title: SubmitAnalysisRequest
      description: "Body for ``POST /analysis``.\n\nExactly one content field must\
        \ be present, matching ``input_type``:\n\n- ``text`` for text input,\n- ``url``\
        \ for URL input (fetched server-side, SSRF-guarded),\n- ``image`` for image\
        \ input — base64-encoded bytes or a ``data:`` URL;\n  validated at the API\
        \ boundary with a size cap, then OCR + forensics\n  (the MIME type is sniffed\
        \ from the bytes by the pipeline)."
    SubmitMediaRequest:
      properties:
        analysis_id:
          type: string
          format: uuid
          title: Analysis Id
        image:
          type: string
          title: Image
      type: object
      required:
      - analysis_id
      - image
      title: SubmitMediaRequest
      description: Body for ``POST /media``.
    SubmitSuggestionRequest:
      properties:
        locale:
          type: string
          maxLength: 16
          minLength: 2
          title: Locale
        namespace:
          type: string
          maxLength: 64
          minLength: 1
          title: Namespace
        key:
          type: string
          maxLength: 128
          minLength: 1
          title: Key
        value:
          type: string
          maxLength: 1000
          minLength: 1
          title: Value
        plural_rule:
          type: string
          pattern: ^(none|zero|one|two|few|many|other)$
          title: Plural Rule
          default: none
      type: object
      required:
      - locale
      - namespace
      - key
      - value
      title: SubmitSuggestionRequest
      description: Body for ``POST /i18n/suggestions``.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
