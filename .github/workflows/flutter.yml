# =====================================================================
# ANNEX — Flutter CI (Phase 9 → 12)
# Runs when a Flutter app or a Flutter package changes: format, static
# analysis, and tests for apps/mobile, apps/web, and the Flutter
# packages (shared_ui, shared_features). Pure-Dart packages
# (shared_utils, shared_models) run in dart.yml.
# =====================================================================

name: Flutter

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/web/**"
      - "packages/shared_ui/**"
      - "packages/shared_features/**"
      # shared_utils/shared_models are dependencies of the Flutter apps
      # and are also exercised here (pure-Dart jobs live in dart.yml).
      - "packages/shared_utils/**"
      - "packages/shared_models/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/web/**"
      - "packages/shared_ui/**"
      - "packages/shared_features/**"
      - "packages/shared_utils/**"
      - "packages/shared_models/**"
      - ".github/workflows/flutter.yml"

# Least privilege: this workflow only reads repository contents.
permissions:
  contents: read

# Cancel superseded runs of the same ref to save CI minutes.
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (shared_ui)
        working-directory: packages/shared_ui
        run: flutter pub get

      - name: Format check (shared_ui)
        working-directory: packages/shared_ui
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (shared_ui)
        working-directory: packages/shared_ui
        run: flutter analyze

      - name: Test (shared_ui)
        working-directory: packages/shared_ui
        run: flutter test

      - name: Install dependencies (shared_features)
        working-directory: packages/shared_features
        run: flutter pub get

      - name: Format check (shared_features)
        working-directory: packages/shared_features
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (shared_features)
        working-directory: packages/shared_features
        run: flutter analyze

      - name: Test (shared_features)
        working-directory: packages/shared_features
        run: flutter test

      - name: Install dependencies (mobile)
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format check (mobile)
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (mobile)
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test (mobile)
        working-directory: apps/mobile
        run: flutter test

      - name: Install dependencies (web)
        working-directory: apps/web
        run: flutter pub get

      - name: Format check (web)
        working-directory: apps/web
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (web)
        working-directory: apps/web
        run: flutter analyze

      - name: Test (web)
        working-directory: apps/web
        run: flutter test
