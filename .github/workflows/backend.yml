# =====================================================================
# ANNEX — Backend CI (Phase 3)
# Runs when backend/ or this workflow changes: lint, format, type-check,
# and test the FastAPI service with coverage enforcement.
# =====================================================================

name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

# Least privilege: this workflow only reads repository contents.
permissions:
  contents: read

# Cancel superseded runs of the same ref to save CI minutes.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend with dev dependencies
        run: |
          cd backend
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          cd backend
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check (mypy)
        run: |
          cd backend
          python -m mypy app

      - name: Test (pytest + coverage)
        run: |
          cd backend
          python -m pytest --cov --cov-report=term-missing
