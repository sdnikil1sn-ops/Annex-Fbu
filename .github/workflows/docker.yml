# =====================================================================
# ANNEX — Docker image CI (Phase 7)
# Builds the backend/worker image on every backend or docker change to
# keep the Dockerfile valid. Image scanning + registry publishing land
# with the release pipeline in Phase 11 (release.yml).
# =====================================================================

name: Docker

on:
  push:
    branches: [main]
    paths: ["backend/**", "docker/**", ".dockerignore", ".github/workflows/docker.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", "docker/**", ".dockerignore", ".github/workflows/docker.yml"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build backend/worker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (backend and worker share it)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: annex-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
