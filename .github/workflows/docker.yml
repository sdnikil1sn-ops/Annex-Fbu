# =====================================================================
# ANNEX — Docker image CI (Phase 7 + Phase 11)
# Builds the backend/worker image on every backend or docker change to
# keep the Dockerfile valid, then scans it with Trivy (CRITICAL/HIGH
# vulnerabilities fail the build). Registry publishing lands in the
# release pipeline (release.yml, Phase 11).
# =====================================================================

name: Docker

on:
  push:
    branches: [main]
    paths: ["backend/**", "docker/**", ".dockerignore", ".github/workflows/docker.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", "docker/**", ".dockerignore", ".github/workflows/docker.yml"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and scan backend/worker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (backend and worker share it)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: annex-backend:ci
          # Load into the local daemon so the next step can scan it.
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: annex-backend:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error
